<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Naming Things — Progress</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <main class="screen">
      <header style="display: flex; flex-direction: column; gap: var(--s-md);">
        <span class="kicker">Progress</span>
        <h1 class="title">Quietly growing.</h1>
      </header>

      <section class="stack--md">
        <div class="stat-card">
          <div class="stat-card__value">42</div>
          <div class="stat-card__label">Words learned</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value">18</div>
          <div class="stat-card__label">Sentences</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value">9</div>
          <div class="stat-card__label">Activities</div>
        </div>
      </section>

      <p class="note">No streaks, no badges. Just the language you've built together.</p>
    </main>

    <nav class="tabbar">
      <a href="home.html" class="tabbar__item">Home</a>
      <a href="bank.html" class="tabbar__item">Bank</a>
      <a href="progress.html" class="tabbar__item tabbar__item--active">Progress</a>
    </nav>
  </div>
  <div class="proto-banner">Prototype · v0.1</div>
</body>
</html>
