<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Naming Things — Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <main class="screen">
      <header class="header">
        <div>
          <div class="kicker">Naming Things</div>
          <div class="language-pill">French</div>
        </div>
      </header>

      <section style="display: flex; flex-direction: column; gap: var(--s-md);">
        <h1 class="title">What are we doing?</h1>
        <div class="generate-box">
          <textarea placeholder="Type what we're doing..." rows="2">bake chocolate chip cookies</textarea>
          <div class="generate-box__footer">
            <span class="generate-box__hint">e.g. bake cookies, draw a dragon</span>
            <a href="loading.html" class="btn">Generate →</a>
          </div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-label">Try something new</h2>
        <div class="activity-list">
          <a href="loading.html" class="activity-list__item">
            <span class="activity-list__title">Build a pillow fort</span>
            <span class="activity-list__arrow" aria-hidden="true">→</span>
          </a>
          <a href="loading.html" class="activity-list__item">
            <span class="activity-list__title">Go on a nature walk</span>
            <span class="activity-list__arrow" aria-hidden="true">→</span>
          </a>
          <a href="loading.html" class="activity-list__item">
            <span class="activity-list__title">Set the table</span>
            <span class="activity-list__arrow" aria-hidden="true">→</span>
          </a>
          <a href="loading.html" class="activity-list__item">
            <span class="activity-list__title">Bake banana bread</span>
            <span class="activity-list__arrow" aria-hidden="true">→</span>
          </a>
          <a href="loading.html" class="activity-list__item">
            <span class="activity-list__title">Plant seeds in a pot</span>
            <span class="activity-list__arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>

      <div class="summary">
        42 words · 18 sentences
        <a href="bank.html">&nbsp;· view vocabulary bank ›</a>
      </div>
    </main>

    <nav class="tabbar">
      <a href="home.html" class="tabbar__item tabbar__item--active">Home</a>
      <a href="bank.html" class="tabbar__item">Bank</a>
      <a href="progress.html" class="tabbar__item">Progress</a>
    </nav>
  </div>
  <div class="proto-banner">Prototype · v0.1</div>
</body>
</html>
