<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="3.5; url=activity.html">
  <title>Naming Things — Generating</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Cycle the status text so the animation feels real in the prototype */
    @keyframes status-fade {
      0%, 30% { opacity: 1; }
      33%, 63% { opacity: 0; }
      66%, 100% { opacity: 0; }
    }
    .status-line {
      position: relative;
      height: 20px;
    }
    .status-line span {
      position: absolute;
      animation: status-cycle 4.5s infinite;
      opacity: 0;
    }
    .status-line span:nth-child(1) { animation-delay: 0s; }
    .status-line span:nth-child(2) { animation-delay: 1.5s; }
    .status-line span:nth-child(3) { animation-delay: 3s; }
    @keyframes status-cycle {
      0%, 28% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <a href="home.html" class="topbar__back">← Cancel</a>
      <span class="topbar__title">generating</span>
    </header>

    <main class="loading">
      <span class="kicker">Now making</span>
      <h1 class="loading__activity">bake chocolate chip cookies</h1>
      <div class="loading__bar" aria-label="Loading"></div>
      <div class="status-line loading__status">
        <span>Finding words…</span>
        <span>Building phrases…</span>
        <span>Ready to play</span>
      </div>
    </main>
  </div>
  <div class="proto-banner">Prototype · v0.1</div>
</body>
</html>
