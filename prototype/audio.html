<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Naming Things — Audio Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <main class="audio-screen">
      <header class="audio-top">
        <a href="activity.html" class="audio-top__close">← Done</a>
        <div class="audio-toggle">
          <a href="activity.html" class="audio-toggle__item">Screen</a>
          <span class="audio-toggle__item audio-toggle__item--active">Audio</span>
        </div>
      </header>

      <div class="audio-type">Words</div>

      <section class="audio-stage">
        <p class="audio-target">la farine</p>
        <p class="audio-base">flour</p>
        <p class="audio-phonetic">lah fah-REEN</p>
      </section>

      <div class="audio-dots">
        <span class="audio-dot audio-dot--past"></span>
        <span class="audio-dot audio-dot--past"></span>
        <span class="audio-dot audio-dot--active"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
        <span class="audio-dot"></span>
      </div>

      <div class="audio-controls">
        <button class="audio-btn" aria-label="Previous">⏮</button>
        <button class="audio-btn audio-btn--primary" aria-label="Pause">⏸</button>
        <button class="audio-btn" aria-label="Next">⏭</button>
      </div>

      <p class="audio-footer">3 of 17 · Words</p>
    </main>
  </div>
  <div class="proto-banner">Prototype · v0.1</div>
</body>
</html>
