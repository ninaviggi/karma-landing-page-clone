<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Naming Things — Session Summary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <main class="summary-screen">
      <header class="summary-screen__head">
        <span class="kicker">Saved</span>
        <h1 class="title">Nicely done.</h1>
        <p class="summary-screen__activity">Baking cookies together · 22 minutes</p>
      </header>

      <section class="summary-stats">
        <div class="summary-stat">
          <span class="summary-stat__value">6</span>
          <span class="summary-stat__label">Words</span>
        </div>
        <div class="summary-stat">
          <span class="summary-stat__value">3</span>
          <span class="summary-stat__label">Sentences</span>
        </div>
        <div class="summary-stat">
          <span class="summary-stat__value">22<span style="font-size: 18px; color: var(--text-tertiary);">m</span></span>
          <span class="summary-stat__label">Together</span>
        </div>
      </section>

      <div class="summary-saved">
        <span class="summary-saved__dot"></span>
        Added to your vocabulary bank.
      </div>

      <section class="rate">
        <h2 class="section-label">Was this activity any good?</h2>
        <div class="rate__buttons">
          <button class="rate__btn rate__btn--active" type="button">
            <span>↑</span>
            Worth doing again
          </button>
          <button class="rate__btn" type="button">
            <span>↓</span>
            Not for us
          </button>
        </div>
      </section>

      <footer class="summary-footer">
        <a href="home.html" class="btn btn--block">Done</a>
      </footer>
    </main>
  </div>
  <div class="proto-banner">Prototype · v0.1</div>
</body>
</html>
